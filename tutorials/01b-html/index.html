<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
</head>

<body>
    <section>
    <div>
        <img src="images/cyborg.png" width="800"  alt="cyborg">
    </div>
    <div>
        <img src="images/cyborg.png" width="300" alt="cyborg">
    </div>
    </section>

    <section>
        <h2> Responsive images using srcset</h2>

        <img src="images/cyborgfallback.jpg" alt="cyborg" 
        srcset="images/cyborg-640.jpg 640w, 
        images/cyborg-1280.jpg 1280w, 
        images/cyborg-1920.jpg 1920w">

    </section>
    




</body>

</html>
